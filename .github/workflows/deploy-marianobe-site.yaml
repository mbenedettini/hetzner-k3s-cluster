name: Marianobe Site deploy

run-name: Deploy Marianobe Site (${{ github.event.client_payload.sha || inputs.sha }})

permissions:
  contents: write

env:
  REPO: "r2-registry-production.mbenedettini-cloudflare.workers.dev/marianobe-site"
  SOURCE_SHA: ${{ github.event.client_payload.sha || inputs.sha }}
  FILE_TO_CHANGE: apps/staging/marianobe-site/deployment.yaml

on:
  repository_dispatch:
    types: [deploy-marianobe-site]
  workflow_dispatch:
    inputs:
      sha:
        required: true
        description: Git SHA

jobs:
  deploy-marianobe-site:
    name: "Deploy Marianobe Site"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.FLUX_BOT_TOKEN }}
      - name: Validate source SHA
        run: |
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{8,40}$ ]]; then
            echo "Invalid source SHA" >&2
            exit 1
          fi
          printf 'IMAGE_TAG=%s\n' "${SOURCE_SHA:0:8}" >> "$GITHUB_ENV"
      - name: Change image tag
        run: yq eval '.spec.template.spec.containers[0].image = strenv(REPO) + ":" + strenv(IMAGE_TAG)' -i "$FILE_TO_CHANGE"
      - name: Commit and Push
        run: |
          git config user.name "flux-infra[bot]"
          git config user.email "flux-infra[bot]@users.noreply.github.com"
          git add -- "$FILE_TO_CHANGE"
          if git diff --cached --quiet; then
            echo "Image tag is already current"
            exit 0
          fi
          git commit -m "[Deploy] Marianobe Site [$IMAGE_TAG]"
          git push

name: Viajar deploy

run-name: Deploy Viajar (${{ github.event.client_payload.sha || inputs.sha }})

permissions:
  contents: write

concurrency:
  group: deploy-viajar
  cancel-in-progress: false

on:
  repository_dispatch:
    types: [deploy-viajar]
  workflow_dispatch:
    inputs:
      sha:
        required: true
        description: Full Git SHA

env:
  BACKEND_REPO: r2-registry-production.mbenedettini-cloudflare.workers.dev/viajar-backend
  RENDERER_REPO: r2-registry-production.mbenedettini-cloudflare.workers.dev/viajar-pdf-renderer
  SHA: ${{ github.event.client_payload.sha || inputs.sha }}

jobs:
  deploy-viajar:
    name: Deploy Viajar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.FLUX_BOT_TOKEN }}
      - name: Validate image SHA
        run: |
          if [[ ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Expected a full Git SHA, received: $SHA"
            exit 1
          fi
      - name: Change image tags
        env:
          IMAGE_TAG: sha-${{ env.SHA }}
        run: |
          yq eval '(.spec.template.spec.containers[] | select(.name == "viajar-backend").image) = env(BACKEND_REPO) + ":" + env(IMAGE_TAG)' -i apps/staging/viajar/backend.yaml
          yq eval '(.spec.template.spec.containers[] | select(.name == "viajar-pdf-renderer").image) = env(RENDERER_REPO) + ":" + env(IMAGE_TAG)' -i apps/staging/viajar/pdf-renderer.yaml
      - name: Commit and push
        run: |
          if git diff --quiet -- apps/staging/viajar/backend.yaml apps/staging/viajar/pdf-renderer.yaml; then
            echo "Viajar is already pinned to $SHA."
            exit 0
          fi
          git config user.name "flux-infra[bot]"
          git config user.email "flux-infra[bot]@users.noreply.github.com"
          git add apps/staging/viajar/backend.yaml apps/staging/viajar/pdf-renderer.yaml
          git commit -m "[Deploy] Viajar [$SHA]"
          git push
